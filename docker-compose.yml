version: '3.8'

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true
  monitoring-network:
    driver: bridge

volumes:
  db_data:
  uploads_data:

services:
  nginx:
    image: nginx:alpine
    container_name: gallery_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend-network
    depends_on:
      - app

  app:
    build: ./app
    container_name: gallery_app
    environment:
      - DB_HOST=gallery_mysql
      - DB_USER=gallery_user
      - DB_PASSWORD=Gallery_User_Pass_2026!
      - DB_NAME=gallery_db
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
      - uploads_data:/usr/src/app/public/uploads
    networks:
      - frontend-network
      - backend-network
      - monitoring-network

  mysql:
    image: mysql:8.0
    container_name: gallery_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Gallery_Root_Pass_2026!
      MYSQL_DATABASE: gallery_db
      MYSQL_USER: gallery_user
      MYSQL_PASSWORD: Gallery_User_Pass_2026!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gallery_phpmyadmin
    environment:
      PMA_HOST: gallery_mysql
      MYSQL_ROOT_PASSWORD: Gallery_Root_Pass_2026!
    ports:
      - "8081:80"
    networks:
      - backend-network
      - frontend-network

  prometheus:
    image: prom/prometheus:latest
    container_name: gallery_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: gallery_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:latest
    container_name: gallery_grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring-network
      - backend-network
    depends_on:
      - prometheus
  loki:
    image: grafana/loki:2.9.0
    container_name: gallery_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring-network

  promtail:
    image: grafana/promtail:2.9.0
    container_name: gallery_promtail
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - monitoring-network
      - backend-network